# Render blueprint: one-click deploy
# 文档: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: quick-chat
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.16.0
